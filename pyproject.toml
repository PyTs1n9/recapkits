[project]
name = "recapkits"
version = "0.0.1"
description = "Local-first, plugin-based year-in-review engine for any data export"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.scripts]
recap = "recapkits.cli:main"

[project.optional-dependencies]
png = [
    "playwright>=1.44",
]

[dependency-groups]
# fonttools / brotli 只在构建期用 (scripts/build-fonts.py 子集化并转 WOFF2),
# 不进 dependencies, 也不进 [png]: 运行时零第三方依赖是硬约束。
dev = ["ruff", "pyright", "pytest", "hypothesis", "fonttools", "brotli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recapkits"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# 设计文档与规格里的 Python 代码块是冻结的引用文本，不参与格式化
exclude = ["*.md"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
# 与 requires-python 的下限对齐: 本地 venv 是 3.13, 不钉版本会拿 3.13 的
# typeshed 检查, CI 的 3.11 job 就会红在本地看不见的地方。
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "design: 设计断言（真实布局溢出 / 像素安全区 / WCAG 对比度; 需要 Node + Playwright + 浏览器）",
]
