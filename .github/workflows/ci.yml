name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

      # 硬规则 1、4 的可执行证据：代码不得出现网络地址与本地时间旁路。
      # 只扫 .py / .mjs —— `src/.../assets/fonts/*.txt` 是 OFL 许可证与来源说明，
      # 里面的 URL 是署名要求的内容，不是可执行的网络请求；把它们排除掉，
      # 这条断言才真的是在守卫代码，而不是在跟许可证较劲。
      - name: forbid-network-and-inline-local-time
        shell: bash
        run: |
          set -e
          ! grep -rn -E "https?://" src --include="*.py" --include="*.mjs"
          ! grep -rn -E "datetime\.now|astimezone|strftime\('%H'\)|urllib\.request|CURRENT_TIMESTAMP" src --include="*.py"

      # 真实导出永不进 git：入库路径的文件名拦截 + fixtures 的 PII/熵扫描。
      # 提交者不会恶意夹带，问题出在 `git add .` 上；这一步让它在合并前失败。
      - name: guard-exports
        run: uv run python scripts/guard-exports.py

  # render 测试用 skipif(needs_node): 无 node 的环境会全部跳过而仍然"全绿"。
  # 这个 job 用一条独立断言把"因为跳过而全绿"挡住。
  node-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node-must-exist-and-be-22
        run: |
          set -euo pipefail
          which node
          command -v node
          node --version
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" -ge 22

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # MP4 测试需要 ffmpeg (系统依赖, 与 node 同等待遇); 没有它时测试会 skip 而仍"全绿"。
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg
      - name: ffmpeg-must-exist
        run: |
          set -euo pipefail
          which ffmpeg
          ffmpeg -version | head -1

      # PNG 测试需要可选依赖与一个浏览器; 装了自带 chromium, 这样"本机没有
      # chrome/msedge"也不会让下面那条"不得跳过"的断言变红。
      - run: uv sync --extra png
      - run: uv run playwright install --with-deps chromium

      # 字体产物与 manifest 必须一致; --check 不下载, 只用提交进仓库的哈希。
      - name: font-manifest
        run: uv run python scripts/build-fonts.py --check

      # 字体内联: 两段 @font-face、零外链、体积 <= 2.6 MB。
      - name: font-in-html
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit/test_fonts_bundled.py -rs | tee fonts.log
          if grep -q "skipped" fonts.log; then
            echo "字体断言被跳过: node / renderer assets 缺失" >&2
            exit 1
          fi

      # MP4 的每一帧都是这些截图的复用; 两次渲染必须逐字节相同。
      - name: png-deterministic
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit/test_render_png_deterministic.py -rs | tee png.log
          if grep -q "skipped" png.log; then
            echo "PNG 确定性测试被跳过: 浏览器缺失" >&2
            exit 1
          fi

      # 时间轴是纯计算, 帧数与时长错了不该等到"看起来有画面"才发现。
      - name: mp4-tests-must-not-skip
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit/test_mp4_timeline.py tests/unit/test_render_mp4.py -rs | tee mp4.log
          if grep -q "skipped" mp4.log; then
            echo "MP4 测试被跳过: ffmpeg / node / 浏览器 缺失" >&2
            exit 1
          fi

      - name: render-tests-must-not-skip
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit/test_render_pipeline.py tests/unit/test_render_cards.py \
            tests/unit/test_render_png.py -rs | tee render-tests.log
          if grep -q "skipped" render-tests.log; then
            echo "render 测试被跳过: node / renderer assets / 浏览器 缺失" >&2
            exit 1
          fi

      # 三条设计断言 (溢出 / 安全区 / 对比度) 同样不能靠"跳过"变绿。
      - name: design-assertions-must-not-skip
        run: |
          set -euo pipefail
          uv run pytest -q -m design -rs | tee design.log
          if grep -q "skipped" design.log; then
            echo "设计断言被跳过: node / renderer assets / 浏览器 缺失" >&2
            exit 1
          fi

  # 防止"改了前端忘了重建": assets/ 是入库的, dist/ 是构建产物, 两者必须一致。
  # 失效的后果很隐蔽 —— 用户拿到的 wheel 里是旧界面, 且不会有任何报错。
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: renderer/pnpm-lock.yaml

      - run: pnpm --dir renderer install --frozen-lockfile
      - run: pnpm --dir renderer run typecheck
      - run: pnpm --dir renderer run build

      - name: renderer-assets-in-sync
        run: python3 scripts/sync-renderer.py --check
